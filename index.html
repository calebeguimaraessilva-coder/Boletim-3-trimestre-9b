<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletim Digital - 9º Ano</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Cabeçalho do Boletim -->
        <header>
            <h1>Boletim Digital</h1>
            <p class="subtitulo">Estudante Exemplo | 9º Ano</p>
        </header>

        <!-- Área dos Cards de Resumo -->
        <section class="cards-grid">
            <div class="card">
                <h3>Média Geral</h3>
                <p id="card-media" class="destaque-card">—</p>
            </div>
            
            <div class="card">
                <h3>Total de Faltas</h3>
                <p id="card-faltas" class="destaque-card">—</p>
            </div>

            <div class="card">
                <h3>Bom Desempenho</h3>
                <p id="card-bom-desempenho" class="destaque-card">—</p>
            </div>

            <div class="card">
                <h3>Atenção</h3>
                <p id="card-atencao" class="destaque-card">—</p>
            </div>

            <div class="card">
                <h3>Frequência</h3>
                <p id="card-frequencia" class="destaque-card">—</p>
            </div>
        </section>

        <!-- Tabela Responsiva de Notas -->
        <section class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Disciplina</th>
                        <th>1º Tri</th>
                        <th>2º Tri</th>
                        <th>3º Tri</th>
                        <th>Média</th>
                        <th>Faltas</th>
                        <th>Situação</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo">
                    <!-- O JavaScript vai preencher as 15 linhas automaticamente aqui -->
                </tbody>
            </table>
        </section>
    </div>

    <!-- Script JavaScript -->
    <script src="script.js"></script>
</body>
</html>
